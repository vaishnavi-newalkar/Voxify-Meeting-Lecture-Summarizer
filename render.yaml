# Render Blueprint — Infrastructure as Code
# https://docs.render.com/infrastructure-as-code

services:
  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  - type: web
    name: voxify-backend
    runtime: docker
    dockerfilePath: ./backend.Dockerfile
    dockerContext: .
    repo: https://github.com/OWNER/REPO
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://voxify-frontend.onrender.com

  # ── React Frontend (nginx) ─────────────────────────────────────────────────
  - type: web
    name: voxify-frontend
    runtime: docker
    dockerfilePath: ./frontend.Dockerfile
    dockerContext: .
    repo: https://github.com/OWNER/REPO
    branch: main
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://voxify-backend.onrender.com
