services:
  - type: web
    name: voxify
    runtime: python
    region: oregon          # free tier region
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: GROQ_API_KEY
        sync: false         # you'll paste this in the Render dashboard
      - key: HF_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
